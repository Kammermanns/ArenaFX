[package]
name = "arenafx"
version = "2.0.0"
description = "ArenaFX – Soundbox für Eishockey-Spiele"
authors = ["Stefan Kammermann"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "arenafx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
bcrypt = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
thiserror = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
