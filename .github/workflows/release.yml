name: Version veröffentlichen

# Start: GitHub → Actions → "Version veröffentlichen" → "Run workflow".
# Die Versionsnummer kommt aus src-tauri/tauri.conf.json (z. B. 2.0.0 → Release v2.0.0).

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Was ist neu? (erscheint in der App als Versionshinweis)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Unit-Tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Bauen, signieren und veröffentlichen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: ArenaFX __VERSION__
          releaseBody: ${{ inputs.notes }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
