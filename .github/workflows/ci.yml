name: Prüfen

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Rust-Tests und End-to-End-Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Systembibliotheken
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            webkit2gtk-driver xvfb gstreamer1.0-plugins-good gstreamer1.0-plugins-base gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatierung
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit-Tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: End-to-End-Test der echten App
        run: |
          cargo install tauri-driver --locked
          pip install --break-system-packages selenium
          (cd src-tauri && cargo build)
          E2E_WORK="$RUNNER_TEMP/e2e" tests/e2e/run.sh

      - name: Screenshots aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e/shots
          if-no-files-found: ignore

  windows:
    name: Windows-Installer bauen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Unit-Tests unter Windows
        working-directory: src-tauri
        run: cargo test --lib

      - name: Installer bauen (ohne Update-Signatur)
        run: npx tauri build --ci --config src-tauri/tauri.test-build.conf.json

      - name: Installer zum Testen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ArenaFX-Installer-Test
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
